plugins { id 'com.android.application' }
android {
    namespace 'kr.local.listenloop'
    compileSdk 35
    defaultConfig { applicationId 'kr.local.listenloop'; minSdk 26; targetSdk 35; versionCode 6; versionName '0.4.2'; testInstrumentationRunner 'kr.local.listenloop.StudyInstrumentation' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { debug { debuggable true } }
}
dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-session:1.5.1'
    implementation 'androidx.core:core:1.15.0'
}
